# One pipeline, three events — step behavior switches on github.event_name:
#
#   pull_request → test + verifiable artifacts: wheel (workflow artifact, 14d
#                  expiry) and image ghcr…:pr-<N> (deleted by ghcr.yml when
#                  the PR closes)
#   push to main → test + release candidates: image sha-<sha> + edge, wheel,
#                  and a rolling DRAFT release pre-named with the next patch
#                  version (edit the tag before publishing for minor/major)
#   release      → PROMOTE the candidate image sha-<sha> → :X.Y.Z + :latest
#                  (manifest retag, no rebuild) and attach the tag-exact wheel
#
# Versioning: git tags are semver (vX.Y.Z); wheels are PEP 440 via
# setuptools-scm — release runs check out the tag itself, so the version comes
# from the tag; PR/main builds get X.Y.(Z+1).devN+g<sha>.

name: main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published, released]

concurrency:
  group: main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # rolling draft + release assets
  packages: write # push images

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/prometejs-miner
  REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + test deps
        run: pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0 # setuptools-scm derives the version from git tags

      - name: Compute version + commit
        id: meta
        run: |
          echo "version=$(pipx run setuptools-scm 2>/dev/null || echo 0.0.0)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release: retag the candidate built at merge — the shipped image is
      # bit-identical to the tested one
      - name: Promote candidate image
        if: github.event_name == 'release'
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.meta.outputs.version }}" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-${{ steps.meta.outputs.sha }}"

      # pull_request → :pr-<N> (one moving tag per PR)
      # push to main → :sha-<sha> + :edge (release candidate)
      - name: Build and push image
        if: github.event_name != 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}:pr-{1}', env.IMAGE, github.event.pull_request.number)
                || format('{0}:sha-{1},{0}:edge', env.IMAGE, github.sha) }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0 # setuptools-scm derives the version from git tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # PEP 440 version comes from git via setuptools-scm: exact X.Y.Z on
      # release (the tag is checked out), dev version otherwise
      - name: Build wheel + sdist
        run: pipx run build

      # event-scoped artifact name so PR and main wheels never collide
      - name: Upload wheel artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ github.event_name == 'pull_request'
                && format('wheel-pr-{0}', github.event.pull_request.number)
                || format('wheel-{0}', github.sha) }}
          path: dist/*
          retention-days: 14

      - name: Refresh rolling draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          NEXT="v$(echo "${LATEST#v}" | awk -F. '{print $1"."$2"."$3+1}')"
          for TAG in $(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
            gh release delete "$TAG" --yes
          done
          gh release create "$NEXT" \
            --draft \
            --target "${{ github.sha }}" \
            --title "prometejs-miner $NEXT" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz

      # replace the draft's dev-versioned assets with the tag-exact build
      - name: Attach wheel to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          for ASSET in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$ASSET" --yes
          done
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz
