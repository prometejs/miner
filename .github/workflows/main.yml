name: main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Run tests
        run: uv run --locked --extra dev pytest -q

  build:
    # pinned: the runner's glibc (2.39) is the oldest the binary is guaranteed to run on
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm derives the version from git tags

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install package + Nuitka in virtualenv
        run: uv sync --locked --no-editable --group build --reinstall-package miner

      - name: Build binary
        run: |
          echo 'from miner.main import cli; cli()' > launcher.py
          uv run --no-sync python -m nuitka --onefile --assume-yes-for-downloads \
            --include-package=miner \
            --include-distribution-metadata=miner \
            --output-dir=dist --output-filename=miner \
            launcher.py

      - uses: oras-project/setup-oras@v2

      - name: Push binary to GHCR
        id: push
        working-directory: dist
        env:
          PR: ${{ github.event.pull_request.number }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('miner'))")
          case "$GITHUB_EVENT_NAME" in
            pull_request) ALIAS="pr-$PR" ;;
            push)         ALIAS="edge" ;;
            release)
              # the build must match its tag, compared in PEP 440 form (v1.2.3-rc1 == 1.2.3rc1)
              uv run --no-project --with packaging python - "$VERSION" "$TAG" <<'EOF'
          import sys
          from packaging.version import Version
          built, tag = sys.argv[1:]
          Version(built) == Version(tag) or sys.exit(f"built version {built} does not match release tag {tag}")
          EOF
              # a prerelease gets its version tag only; latest stays on the last full release
              [ "$PRERELEASE" = true ] || ALIAS="latest" ;;
          esac
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # tags: the binary's version ('+' is not allowed in a tag) plus the moving alias, if any
          DIGEST=$(oras push "ghcr.io/$GITHUB_REPOSITORY:${VERSION//+/-}${ALIAS:+,$ALIAS}" \
            --artifact-type application/vnd.prometejs.miner \
            --artifact-platform linux/amd64 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --format 'go-template={{.digest}}' \
            miner)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest the build
        if: ${{github.event_name != 'pull_request'}}
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Attest binary
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@v4
        with:
          subject-path: dist/miner
