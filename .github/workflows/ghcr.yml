# GHCR cleanup (cron / dispatch): stale sweep of dev builds from PRs and main,
# tagged X.Y.Z.devN-g<sha> plus the pr-<N> alias (>7d), and untagged manifests.
# edge is never matched, so the newest main build always survives.

name: ghcr

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale dev builds
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: "*.dev*,pr-*"
          older-than: 7 days
          delete-untagged: true
          validate: true
          dry-run: ${{ inputs.dry-run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
