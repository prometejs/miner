[project]
name = "miner"
dynamic = ["version"]
description = "Self-hosted Bitcoin solo-mining stratum server with quanta work accounting"
requires-python = "==3.13.*"
dependencies = [
    "aiohttp>=3.9",
    "pyzmq>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# build toolchain for the Nuitka binary — locked in uv.lock like everything else
[dependency-groups]
build = ["nuitka>=4.2", "patchelf>=0.17; sys_platform == 'linux'"]

[project.scripts]
miner = "miner.main:cli"

[project.urls]
Repository = "https://github.com/prometejs/miner"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# Versioning: git tags are semver (vX.Y.Z); wheel versions are PEP 440,
# derived by setuptools-scm (1.2.3 on a tag, 1.2.4.devN+g<sha> between tags).
# The binary and its registry tag both carry exactly this version.
[tool.setuptools_scm]
fallback_version = "0.0.0"

# sources live in src/, but the import name stays `miner`
[tool.setuptools]
package-dir = { "miner" = "src" }
packages = [
    "miner",
    "miner.bitcoin",
    "miner.jobs",
    "miner.quanta",
    "miner.rpc",
    "miner.stratum",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
